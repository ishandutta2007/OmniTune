<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow2" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Accents -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="35%" stop-color="#a855f7" />
      <stop offset="70%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="chipBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .pulse-glow {
        animation: pulseAnimation 4s ease-in-out infinite alternate;
      }
      .rotate-ring {
        transform-origin: 1040px 210px;
        animation: spin 24s linear infinite;
      }
      .rotate-ring-reverse {
        transform-origin: 1040px 210px;
        animation: spinReverse 18s linear infinite;
      }
      .signal-flow {
        stroke-dasharray: 8 16;
        animation: flowDash 3s linear infinite;
      }
      .float-badge {
        animation: floatAnim 4s ease-in-out infinite alternate;
      }
      .shimmer-text {
        background-size: 200% auto;
        animation: textShimmer 6s linear infinite;
      }
      .pulse-dot {
        animation: dotPulse 2.5s ease-in-out infinite alternate;
      }

      @keyframes pulseAnimation {
        0% { opacity: 0.3; transform: scale(0.98); }
        100% { opacity: 0.8; transform: scale(1.02); }
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes spinReverse {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes flowDash {
        0% { stroke-dashoffset: 48; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatAnim {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-6px); }
      }
      @keyframes dotPulse {
        0% { r: 3px; opacity: 0.4; }
        100% { r: 6px; opacity: 1; filter: drop-shadow(0 0 6px #38bdf8); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" rx="16" fill="#0b0f19" />
  <rect width="100%" height="100%" rx="16" fill="url(#bgGlow1)" />
  <rect width="100%" height="100%" rx="16" fill="url(#bgGlow2)" />
  <rect width="100%" height="100%" rx="16" fill="url(#bgGlow3)" />

  <!-- Outer Border -->
  <rect x="1.5" y="1.5" width="1197" height="417" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Decorative Grid Pattern -->
  <g stroke="#334155" stroke-opacity="0.18" stroke-width="1">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300 M 0,360 L 1200,360" />
    <path d="M 100,0 L 100,420 M 200,0 L 200,420 M 300,0 L 300,420 M 400,0 L 400,420 M 500,0 L 500,420 M 600,0 L 600,420 M 700,0 L 700,420 M 800,0 L 800,420 M 900,0 L 900,420 M 1000,0 L 1000,420 M 1100,0 L 1100,420" />
  </g>

  <!-- Neural Connection Dynamic Lines -->
  <g fill="none" stroke-width="1.8">
    <!-- Curved Synapse Lines -->
    <path d="M 80,340 C 260,340 380,240 520,240 C 660,240 760,160 1040,210" stroke="#38bdf8" stroke-opacity="0.35" class="signal-flow" />
    <path d="M 120,80 C 320,80 440,190 640,190 C 800,190 880,260 1040,210" stroke="#a855f7" stroke-opacity="0.35" class="signal-flow" style="animation-duration: 4s;" />
    <path d="M 400,370 C 600,370 720,280 860,260 C 940,248 990,225 1040,210" stroke="#ec4899" stroke-opacity="0.35" class="signal-flow" style="animation-duration: 5s;" />
  </g>

  <!-- Right Decorative Sci-Fi Visual Element / Orbiting Ring System -->
  <g opacity="0.95">
    <!-- Ambient back glow behind orb -->
    <circle cx="1040" cy="210" r="110" fill="#6366f1" opacity="0.12" filter="url(#glow)"/>
    <circle cx="1040" cy="210" r="70" fill="#a855f7" opacity="0.18" filter="url(#glow)"/>

    <!-- Rotating dashed outer ring -->
    <circle class="rotate-ring" cx="1040" cy="210" r="130" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="14 20 8 20" opacity="0.5" />
    <circle class="rotate-ring-reverse" cx="1040" cy="210" r="100" fill="none" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="10 14 30 14" opacity="0.6" />
    <circle cx="1040" cy="210" r="75" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.4" />
    
    <!-- Central AI Core Sphere -->
    <circle cx="1040" cy="210" r="46" fill="url(#accentGrad)" filter="url(#softGlow)" />
    <circle cx="1040" cy="210" r="42" fill="#0f172a" />
    <circle cx="1040" cy="210" r="28" fill="url(#textGrad)" opacity="0.9" />
    
    <!-- Core Icon (Omni Nodes) -->
    <path d="M 1040,195 L 1052,216 L 1028,216 Z" fill="#ffffff" opacity="0.9" />
    <circle cx="1040" cy="210" r="5" fill="#0b0f19" />

    <!-- Orbiting satellite nodes -->
    <circle cx="1170" cy="210" class="rotate-ring pulse-dot" fill="#38bdf8" />
    <circle cx="910" cy="210" class="rotate-ring pulse-dot" fill="#ec4899" />
    <circle cx="1040" cy="110" class="rotate-ring-reverse pulse-dot" fill="#a855f7" />
    <circle cx="1040" cy="310" class="rotate-ring-reverse pulse-dot" fill="#38bdf8" />
  </g>

  <!-- Left Content Area -->
  <g transform="translate(80, 0)">
    <!-- Top Tag / Pill -->
    <g transform="translate(0, 68)" class="float-badge">
      <rect width="270" height="34" rx="17" fill="url(#chipBg)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7"/>
      <circle cx="18" cy="17" r="5" fill="#10b981">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="22" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">NEXT-GEN LLM &amp; VLM STUDIO</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 160)">
      <text fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Helvetica Neue', sans-serif" font-size="64" font-weight="900" letter-spacing="-1">
        OmniTune
      </text>
      <!-- Subtle Title Glow Overlay -->
      <text fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Helvetica Neue', sans-serif" font-size="64" font-weight="900" letter-spacing="-1" opacity="0.3" filter="url(#glow)">
        OmniTune
      </text>
    </g>

    <!-- Subtitle -->
    <text x="0" y="210" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500">
      Unified, High-Performance Fine-Tuning for <tspan fill="#38bdf8" font-weight="700">100+ Frontier Models</tspan>
    </text>

    <text x="0" y="240" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400">
      LLaMA 3.3 • DeepSeek-R1 • Qwen 2.5 • Mistral • LoRA / QLoRA • DPO / PPO • DeepSpeed &amp; FSDP
    </text>

    <!-- Feature Badges -->
    <g transform="translate(0, 280)">
      <!-- Badge 1: 100+ Models -->
      <g transform="translate(0, 0)">
        <rect width="145" height="42" rx="10" fill="url(#chipBg)" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.6"/>
        <text x="14" y="26" font-size="16">🧠</text>
        <text x="40" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">100+ Models</text>
      </g>

      <!-- Badge 2: LoRA / QLoRA -->
      <g transform="translate(160, 0)">
        <rect width="155" height="42" rx="10" fill="url(#chipBg)" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.6"/>
        <text x="14" y="26" font-size="16">⚡</text>
        <text x="40" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">LoRA / QLoRA</text>
      </g>

      <!-- Badge 3: Multi-Paradigms -->
      <g transform="translate(330, 0)">
        <rect width="165" height="42" rx="10" fill="url(#chipBg)" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.6"/>
        <text x="14" y="26" font-size="16">⚖️</text>
        <text x="40" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">SFT • DPO • PPO</text>
      </g>

      <!-- Badge 4: Web UI Dashboard -->
      <g transform="translate(510, 0)">
        <rect width="180" height="42" rx="10" fill="url(#chipBg)" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.6"/>
        <text x="14" y="26" font-size="16">🖥️</text>
        <text x="40" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">OmniTune-Board</text>
      </g>

      <!-- Badge 5: vLLM & FSDP -->
      <g transform="translate(705, 0)">
        <rect width="150" height="42" rx="10" fill="url(#chipBg)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.6"/>
        <text x="14" y="26" font-size="16">🚀</text>
        <text x="40" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">vLLM &amp; FSDP2</text>
      </g>
    </g>

    <!-- Bottom Status / Terminal Prompt Aesthetic -->
    <g transform="translate(0, 355)">
      <rect width="480" height="30" rx="6" fill="#030712" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="15" r="4" fill="#ef4444"/>
      <circle cx="28" cy="15" r="4" fill="#f59e0b"/>
      <circle cx="40" cy="15" r="4" fill="#10b981"/>
      <text x="60" y="19" fill="#38bdf8" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="12" font-weight="500">$</text>
      <text x="75" y="19" fill="#e2e8f0" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="12">pip install omnitune &amp;&amp; omnitune webui</text>
    </g>
  </g>
</svg>

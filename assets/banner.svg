<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B14" />
      <stop offset="50%" stop-color="#0D1322" />
      <stop offset="100%" stop-color="#05070D" />
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8; #818CF8; #C084FC; #38BDF8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818CF8">
        <animate attributeName="stop-color" values="#818CF8; #C084FC; #38BDF8; #818CF8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#C084FC">
        <animate attributeName="stop-color" values="#C084FC; #38BDF8; #818CF8; #C084FC" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#9333EA" stop-opacity="0.6" />
    </linearGradient>

    <radialGradient id="mesh-glow" cx="75%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.25">
        <animate attributeName="stop-opacity" values="0.15; 0.35; 0.15" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#080B14" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="pulse-glow" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.2">
        <animate attributeName="stop-opacity" values="0.25; 0.08; 0.25" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#080B14" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="blur-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
    </filter>
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.6" />
    </pattern>
  </defs>

  <style>
    @keyframes waveMotion {
      0% { transform: translateX(0px) translateY(0px); }
      50% { transform: translateX(-40px) translateY(10px); }
      100% { transform: translateX(0px) translateY(0px); }
    }
    @keyframes waveAlt {
      0% { transform: translateX(0px) translateY(0px); }
      50% { transform: translateX(40px) translateY(-12px); }
      100% { transform: translateX(0px) translateY(0px); }
    }
    @keyframes pulseScale {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.18); opacity: 1; filter: drop-shadow(0 0 12px #38BDF8); }
    }
    @keyframes floatChip {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    .wave-1 { animation: waveMotion 10s ease-in-out infinite; }
    .wave-2 { animation: waveAlt 12s ease-in-out infinite; }
    .node-pulse { animation: pulseScale 3.5s ease-in-out infinite; transform-origin: center; }
    .chip-float { animation: floatChip 6s ease-in-out infinite; }
    .font-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; letter-spacing: -1.5px; }
    .font-subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; letter-spacing: 0.5px; }
    .font-badge { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 600; letter-spacing: 1px; }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="16" />
  <rect width="100%" height="100%" fill="url(#pulse-glow)" />
  <rect width="100%" height="100%" fill="url(#mesh-glow)" />
  <rect width="100%" height="100%" fill="url(#cyber-grid)" rx="16" />

  <!-- Animated Ambient Lights / Neon Waves in Background -->
  <g opacity="0.35" class="wave-1">
    <path d="M-100 280 Q 250 140, 600 260 T 1300 180" fill="none" stroke="url(#brand-grad)" stroke-width="3" filter="url(#neon-glow)">
      <animate attributeName="d"
        values="M-100 280 Q 250 140, 600 260 T 1300 180;
                M-100 260 Q 250 320, 600 180 T 1300 240;
                M-100 280 Q 250 140, 600 260 T 1300 180"
        dur="12s" repeatCount="indefinite" />
    </path>
  </g>

  <g opacity="0.25" class="wave-2">
    <path d="M-100 220 Q 350 340, 750 200 T 1300 300" fill="none" stroke="url(#glow-grad)" stroke-width="2" filter="url(#blur-filter)">
      <animate attributeName="d"
        values="M-100 220 Q 350 340, 750 200 T 1300 300;
                M-100 240 Q 350 160, 750 280 T 1300 190;
                M-100 220 Q 350 340, 750 200 T 1300 300"
        dur="14s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- High-tech Right Graphic Illustration (Tuning Neural Lattice) -->
  <g transform="translate(850, 205)" class="chip-float">
    <!-- Center Orb / Core -->
    <circle cx="0" cy="0" r="80" fill="#0F172A" stroke="#334155" stroke-width="2" />
    <circle cx="0" cy="0" r="70" fill="none" stroke="url(#brand-grad)" stroke-width="2.5" stroke-dasharray="12 6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="48" fill="#1E1B4B" stroke="#6366F1" stroke-width="1.5" opacity="0.8" />
    
    <!-- Central Pulsing AI Tuning Node -->
    <circle cx="0" cy="0" r="18" fill="url(#brand-grad)" class="node-pulse" />

    <!-- Orbital Ring 1 -->
    <ellipse cx="0" cy="0" rx="140" ry="55" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.6" stroke-dasharray="6 8">
      <animateTransform attributeName="transform" type="rotate" from="30" to="390" dur="24s" repeatCount="indefinite" />
    </ellipse>

    <!-- Orbital Ring 2 -->
    <ellipse cx="0" cy="0" rx="150" ry="60" fill="none" stroke="#A855F7" stroke-width="1.5" opacity="0.5" stroke-dasharray="8 6">
      <animateTransform attributeName="transform" type="rotate" from="-40" to="320" dur="28s" repeatCount="indefinite" />
    </ellipse>

    <!-- Satellite Nodes -->
    <g>
      <circle cx="-110" cy="-35" r="7" fill="#38BDF8" filter="url(#neon-glow)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite" />
      </circle>
      <line x1="-110" y1="-35" x2="0" y2="0" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4" />
      
      <circle cx="120" cy="25" r="6" fill="#818CF8" filter="url(#neon-glow)">
        <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.2s" repeatCount="indefinite" />
      </circle>
      <line x1="120" y1="25" x2="0" y2="0" stroke="#818CF8" stroke-width="1" stroke-opacity="0.4" />

      <circle cx="45" cy="-85" r="5" fill="#C084FC" filter="url(#neon-glow)">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite" />
      </circle>
      <line x1="45" y1="-85" x2="0" y2="0" stroke="#C084FC" stroke-width="1" stroke-opacity="0.3" />

      <circle cx="-60" cy="80" r="5.5" fill="#34D399" filter="url(#neon-glow)">
        <animate attributeName="opacity" values="0.9;0.3;0.9" dur="3.6s" repeatCount="indefinite" />
      </circle>
      <line x1="-60" y1="80" x2="0" y2="0" stroke="#34D399" stroke-width="1" stroke-opacity="0.3" />
    </g>

    <!-- Floating Badge: 100+ LLMs -->
    <g transform="translate(-130, -105)">
      <rect width="105" height="28" rx="14" fill="#0F172A" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.8" />
      <text x="52" y="18" text-anchor="middle" fill="#38BDF8" class="font-badge">100+ MODELS</text>
    </g>

    <!-- Floating Badge: LoRA / FSDP2 -->
    <g transform="translate(40, 95)">
      <rect width="115" height="28" rx="14" fill="#0F172A" stroke="#A855F7" stroke-width="1" stroke-opacity="0.8" />
      <text x="57" y="18" text-anchor="middle" fill="#C084FC" class="font-badge">LORA &bull; FSDP2</text>
    </g>
  </g>

  <!-- Left Content Area (Branding & Typography) -->
  <g transform="translate(80, 80)">
    <!-- Top Pill Tag -->
    <g transform="translate(0, 10)">
      <rect width="215" height="30" rx="15" fill="#1E293B" fill-opacity="0.75" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="16" cy="15" r="4.5" fill="#38BDF8">
        <animate attributeName="opacity" values="1; 0.3; 1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="30" y="19.5" fill="#E2E8F0" class="font-badge">UNIFIED FINE-TUNING</text>
    </g>

    <!-- Main Title: OmniTune -->
    <g transform="translate(0, 95)">
      <text x="0" y="0" fill="url(#brand-grad)" class="font-title" font-size="64" filter="url(#neon-glow)">OmniTune</text>
    </g>

    <!-- Subtitle -->
    <g transform="translate(0, 138)">
      <text x="0" y="0" fill="#F8FAFC" class="font-title" font-size="22" opacity="0.95">
        Frontier Fine-Tuning, Alignment &amp; Deployment for 100+ LLMs &amp; VLMs
      </text>
    </g>

    <!-- Description / Capabilities line -->
    <g transform="translate(0, 172)">
      <text x="0" y="0" fill="#94A3B8" class="font-subtitle" font-size="15">
        Production-grade SFT, DPO, PPO &amp; KTO with DeepSpeed, FSDP2, Liger Kernel &amp; vLLM.
      </text>
    </g>

    <!-- Feature Badges Row -->
    <g transform="translate(0, 215)">
      <!-- Badge 1: SFT & Preference Tuning -->
      <g transform="translate(0, 0)">
        <rect width="150" height="34" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1" />
        <path d="M16 17 L22 23 L32 11" fill="none" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
        <text x="40" y="21" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">SFT / DPO / KTO</text>
      </g>

      <!-- Badge 2: Multi-Modal VLMs -->
      <g transform="translate(162, 0)">
        <rect width="140" height="34" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1" />
        <path d="M178 17 L184 23 L194 11" fill="none" stroke="#818CF8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
        <text x="36" y="21" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">LLMs &amp; VLMs</text>
      </g>

      <!-- Badge 3: Web UI Board -->
      <g transform="translate(314, 0)">
        <rect width="155" height="34" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1" />
        <path d="M330 17 L336 23 L346 11" fill="none" stroke="#C084FC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
        <text x="36" y="21" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">OmniTune-Board</text>
      </g>

      <!-- Badge 4: High Throughput -->
      <g transform="translate(481, 0)">
        <rect width="148" height="34" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1" />
        <path d="M497 17 L503 23 L513 11" fill="none" stroke="#34D399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
        <text x="36" y="21" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">vLLM Inference</text>
      </g>
    </g>
  </g>

  <!-- Border Highlight Outline -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="url(#brand-grad)" stroke-width="1.25" stroke-opacity="0.4" />
</svg>
